[project]
name = "telegram-price-scraper-bot"
version = "0.1.0"
description = "Telegram bot for comparing product prices across multiple online stores."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20,<4",
    "beautifulsoup4>=4.13,<5",
    "openpyxl>=3.1,<4",
    "pandas>=3.0,<4",
    "playwright>=1.55,<2",
    "python-dotenv>=1.0,<2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM117"]